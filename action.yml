name: PR Target Validation
description: Validate a PR target branch against its associated Linear release.

inputs:
  branch:
    required: false
    description: PR head branch containing the Linear issue identifier.
  target:
    required: false
    description: PR base branch to validate.
  linear-access-key:
    required: true
    description: Linear API key used to retrieve the issue's releases.
  teams:
    required: false
    default: "ENG,MAN,SUP"
    description: Comma-separated list of allowed Linear team prefixes.
  default-target:
    required: false
    default: dev
    description: Required target when the Linear issue has no release named vX.Y.Z, or when that release branch does not exist.
  release-prefix:
    required: false
    default: release/v
    description: Target branch prefix prepended to the version in the release name.
  dry-run:
    required: false
    default: "false"
    description: Resolve the PR branches from pr-url and validate without needing branch or target inputs.
  pr-url:
    required: false
    description: GitHub pull request URL to validate when dry-run is enabled.
  github-token:
    required: false
    description: Token for reading the pull request and checking whether a release branch exists. Defaults to the workflow's GITHUB_TOKEN.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"

    - name: Validate PR target
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        DEFAULT_TARGET: ${{ inputs.default-target }}
        DRY_RUN: ${{ inputs.dry-run }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
        LINEAR_ACCESS_KEY: ${{ inputs.linear-access-key }}
        PR_URL: ${{ inputs.pr-url }}
        RELEASE_PREFIX: ${{ inputs.release-prefix }}
        TARGET: ${{ inputs.target }}
        TEAMS: ${{ inputs.teams }}
      run: python "${{ github.action_path }}/validate.py"
